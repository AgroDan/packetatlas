{{- if .Values.rbac.create }}
# Read-only: workload discovery, pod readiness, and per-pod traffic from the
# kubelet Summary API (nodes/proxy).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "packetatlas.fullname" . }}
  labels:
    {{- include "packetatlas.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods, services, nodes]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [nodes/proxy]
    verbs: [get]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "packetatlas.fullname" . }}
  labels:
    {{- include "packetatlas.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "packetatlas.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "packetatlas.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
