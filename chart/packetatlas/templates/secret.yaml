{{- if and (eq .Values.mode "agent") .Values.agent.token (not .Values.agent.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "packetatlas.tokenSecret" . }}
  labels:
    {{- include "packetatlas.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ .Values.agent.token | quote }}
{{- end }}
