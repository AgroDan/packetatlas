{{- if and (eq .Values.mode "server") .Values.server.ingress.enabled }}
{{- with .Values.server.ingress }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "packetatlas.fullname" $ }}
  labels:
    {{- include "packetatlas.labels" $ | nindent 4 }}
  {{- with .annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "packetatlas.fullname" $ }}
                port:
                  name: http
{{- end }}
{{- end }}
