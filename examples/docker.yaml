# PacketAtlas for a Docker host, reaching the Engine API through
# socket-proxy. Used by examples/docker-compose.yaml.

docker:
  host: tcp://socket-proxy:2375

discovery:
  docker:
    enabled: true
    # projects: [blog]               # default: all compose projects
    # exclude_projects: [scratch]
    # require_label: true            # only containers labelled packetatlas.io/discover=true

